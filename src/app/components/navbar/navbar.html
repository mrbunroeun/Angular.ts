<div class="fixed top-0 left-0 w-full z-40 pointer-events-none">
  <!-- Top info bar -->
  <section
    class="w-full h-[38px] md:h-[50px] bg-[#2E0073] flex flex-row justify-center gap-[10rem] sm:gap-[20rem] md:gap-[50rem] items-center pointer-events-auto relative z-50"
  >
    <p class="text-white text-[11px] md:text-xs font-light">Address</p>
    <!--
      FIX: this was `routerLink="tel:0123132277"`. routerLink hands the URL to
      Angular's Router, which tries to match it against your route config
      instead of letting the browser dial the number — on a real device this
      link did nothing (or hit your wildcard/404 route). A tel: link is an
      external protocol, so it must be a plain href, not a routerLink.
    -->
    <a
      href="tel:0123132277"
      class="text-white text-[11px] md:text-xs font-light hover:opacity-80 transition duration-300 ease-in-out"
    >
      012 31 32 77
    </a>
  </section>

  <!-- Floating navbar -->
  <section class="relative mt-10 md:mt-12 z-30 pointer-events-auto">
    <div
      class="grid grid-cols-[auto_1fr_auto] items-center mx-auto rounded-full bg-white/95 backdrop-blur-md shadow-xl w-[90%] md:w-[80%] px-6 md:px-10 h-12 md:h-[60px] transition duration-300 ease-in-out"
    >
      <!-- Logo -->
      <a routerLink="/">
        <img
          src="logo/metro_log.svg"
          alt="Metro Catering Logo"
          class="h-4 md:h-6 w-auto shrink-0"
        />
      </a>

      <!-- Desktop links -->
      <div class="hidden lg:flex flex-row items-center justify-center gap-10 text-base">
        <!--
          FIX (this pattern repeats on every top-level link below): the original
          markup had a static `text-gray-700` class sitting alongside a
          `routerLinkActive="text-[#B00000]"` class that gets added on top of it.
          When the route is active, BOTH classes are present in the DOM at once,
          and since they're two same-specificity Tailwind utilities targeting the
          same `color` property, whichever one Tailwind happens to generate later
          in the compiled stylesheet wins — not necessarily the active/red one.
          That's why "highlight current page" could render unreliably.

          Fix: use routerLinkActive purely for its `isActive` state (via the
          #xActive="routerLinkActive" export) and compute ONE class string from
          it, so gray and red are never both present at the same time. Also
          restores the `hover:text-[#B00000]` that was missing from Home only.
        -->
        <a
          routerLink="/"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: true }"
          #homeActive="routerLinkActive"
          [class]="
            homeActive.isActive
              ? 'text-[#B00000] font-bold transition duration-300 ease-in-out'
              : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'
          "
          >Home</a
        >

        <a
          routerLink="/about"
          routerLinkActive
          #aboutActive="routerLinkActive"
          [class]="
            aboutActive.isActive
              ? 'text-[#B00000] font-bold transition duration-300 ease-in-out'
              : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'
          "
          >About Metro Catering</a
        >

        <!-- Catering dropdown (desktop, hover + click) -->
        <div
          class="relative"
          (mouseenter)="onTriggerEnter()"
          (mouseleave)="onTriggerLeave()"
        >
          <!--
            FIX: this is the same collision bug as above, but worse — the
            original had routerLinkActive on this wrapping <div>, while the
            <button> inside it hard-coded its own `text-gray-700`. An element's
            own directly-applied class always wins over a color inherited from
            an ancestor, so the trigger text could NEVER turn red on a child
            catering route, no matter what the div's classes were doing.
            `font-bold` happened to inherit fine, so you'd see bold-but-gray —
            a good sign something upstream was broken.

            Fix: read the div's isActive state via exportAs and drive the
            button's own class list directly from it.
          -->
          <button
            type="button"
            (click)="toggleCatering($event)"
            (keydown)="onTriggerKeydown($event)"
            [attr.aria-expanded]="isCateringOpen()"
            aria-haspopup="true"
            [class]="
              isCateringActive()
                ? 'flex items-center gap-1 text-[#B00000] font-bold transition duration-300 ease-in-out focus:outline-none'
                : 'flex items-center gap-1 text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out focus:outline-none'
            "
          >
            Catering Services
            <svg
              class="w-3.5 h-3.5 transition-transform duration-500 ease-in-out"
              [class.rotate-180]="isCateringOpen()"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              [style.stroke-width]="isCateringActive() ? '3.5' : '2.5'"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div
            class="absolute left-1/2 -translate-x-1/2 mt-4 w-64 origin-top rounded-2xl bg-white shadow-xl transition-all duration-200 ease-out"
            [class.scale-95]="!isCateringOpen()"
            [class.scale-100]="isCateringOpen()"
            [class.-translate-y-1]="!isCateringOpen()"
            [class.translate-y-0]="isCateringOpen()"
            [class.opacity-0]="!isCateringOpen()"
            [class.opacity-100]="isCateringOpen()"
            [class.pointer-events-none]="!isCateringOpen()"
            [class.pointer-events-auto]="isCateringOpen()"
            [class.invisible]="!isCateringOpen()"
            [attr.inert]="isCateringOpen() ? null : ''"
            (mouseenter)="onPanelEnter()"
            (mouseleave)="onPanelLeave()"
          >
            <!--
              FIX: these five links were hard-coded here AND duplicated again in
              the mobile accordion below, while the component already had a
              `cateringItems` array that nothing used. Two sources of truth for
              the same nav data is exactly the kind of redundant state the audit
              asked to remove — and it's also why keyboard nav below was broken:
              there was nowhere to put the (keydown) binding without editing five
              near-identical blocks by hand. Looping over the array fixes both.
            -->
            @for (item of cateringItems; track item.path; let i = $index) {
              <a
                #cateringItem
                [routerLink]="item.path"
                class="block px-5 py-3 transition-colors duration-300 ease-in-out"
                [class]="
                  isActivePath(item.path)
                    ? 'text-[#B00000] font-bold'
                    : 'text-gray-700 hover:text-[#B00000]'
                "
                (keydown)="onDropdownKeydown($event, i)"
                >{{ item.label }}</a
              >
            }
          </div>
        </div>

        <a
          routerLink="/latest-event"
          routerLinkActive
          #eventsActive="routerLinkActive"
          [class]="
            eventsActive.isActive
              ? 'text-[#B00000] font-bold transition duration-300 ease-in-out'
              : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'
          "
          >Latest Events</a
        >
        <a
          routerLink="/career"
          routerLinkActive
          #careerActive="routerLinkActive"
          [class]="
            careerActive.isActive
              ? 'text-[#B00000] font-bold transition duration-300 ease-in-out'
              : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'
          "
          >Career</a
        >
        <a
          routerLink="/contact"
          routerLinkActive
          #contactActive="routerLinkActive"
          [class]="
            contactActive.isActive
              ? 'text-[#B00000] font-bold transition duration-300 ease-in-out'
              : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'
          "
          >Contact Us</a
        >
      </div>

      <!-- phone view -->

      <!-- Mobile hamburger -->
      <button
        type="button"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
        class="lg:hidden cursor-pointer flex flex-col justify-center items-center gap-[5px] w-10 h-10 rounded-full hover:bg-black/5 transition duration-300 ease-in-out ml-auto"
      >
        <span
          class="block w-5 h-[2px] bg-gray-800 transition duration-300 ease-in-out"
          [class.rotate-45]="isMenuOpen()"
          [class.translate-y-[7px]]="isMenuOpen()"
        ></span>
        <span
          class="block w-5 h-[2px] bg-gray-800 transition duration-300 ease-in-out"
          [class.opacity-0]="isMenuOpen()"
        ></span>
        <span
          class="block w-5 h-[2px] bg-gray-800 transition duration-300 ease-in-out"
          [class.-rotate-45]="isMenuOpen()"
          [class.-translate-y-[7px]]="isMenuOpen()"
        ></span>
      </button>
    </div>

    <!-- Backdrop -->
    <div
      class="lg:hidden fixed inset-0 top-0 h-screen bg-black/30 -z-10 transition-opacity duration-300 ease-in-out"
      [class.opacity-0]="!isMenuOpen()"
      [class.opacity-100]="isMenuOpen()"
      [class.pointer-events-none]="!isMenuOpen()"
      [class.pointer-events-auto]="isMenuOpen()"
      [class.invisible]="!isMenuOpen()"
      (click)="closeMobileMenu()"
      aria-hidden="true"
    ></div>

    <!-- Mobile menu panel -->
    <div
      class="lg:hidden absolute left-1/2 top-full mt-2 w-[90%] md:w-[80%] -translate-x-1/2 origin-top rounded-3xl bg-white/95 backdrop-blur-md shadow-xl px-6 py-4 transition-all duration-300 ease-out"
      [class.scale-95]="!isMenuOpen()"
      [class.scale-100]="isMenuOpen()"
      [class.-translate-y-1]="!isMenuOpen()"
      [class.translate-y-0]="isMenuOpen()"
      [class.opacity-0]="!isMenuOpen()"
      [class.opacity-100]="isMenuOpen()"
      [class.pointer-events-none]="!isMenuOpen()"
      [class.pointer-events-auto]="isMenuOpen()"
      [class.invisible]="!isMenuOpen()"
      [attr.inert]="isMenuOpen() ? null : ''"
    >
      <div class="flex flex-col gap-3 text-base">
        <a
          routerLink="/"
          (click)="closeMobileMenu()"
          routerLinkActive
          #mHomeActive="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          [class]="mHomeActive.isActive ? 'text-[#B00000] font-bold' : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'"
          >Home</a
        >
        <a
          routerLink="/about"
          (click)="closeMobileMenu()"
          routerLinkActive
          #mAboutActive="routerLinkActive"
          [class]="mAboutActive.isActive ? 'text-[#B00000] font-bold' : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'"
          >About Metro Catering</a
        >

        <div>
          <button
            type="button"
            (click)="toggleMobileCatering()"
            [attr.aria-expanded]="isMobileCateringOpen()"
            [class]="
              isCateringActive()
                ? 'flex items-center justify-between w-full text-[#B00000] font-bold transition duration-300 ease-in-out'
                : 'flex items-center justify-between w-full text-gray-700 hover:text-[#B00000] font-bold transition duration-300 ease-in-out'
            "
          >
            Catering Services
            <svg
              class="w-4 h-4 transition-transform duration-500 ease-in-out"
              [class.rotate-180]="isMobileCateringOpen()"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              [style.stroke-width]="isCateringActive() ? '3.5' : '2.5'"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div
            class="grid transition-[grid-template-rows] duration-500 ease-in-out"
            [style.grid-template-rows]="isMobileCateringOpen() ? '1fr' : '0fr'"
          >
            <div class="overflow-hidden">
              <div class="flex flex-col mt-2 rounded-xl overflow-hidden bg-black/[0.03]">
                @for (item of cateringItems; track item.path) {
                  <a
                    [routerLink]="item.path"
                    (click)="closeMobileMenu()"
                    class="block px-4 py-3 transition-colors duration-300 ease-in-out"
                    [class]="
                      isActivePath(item.path)
                        ? 'text-[#B00000] font-bold'
                        : 'text-gray-700 hover:text-[#B00000]'
                    "
                    >{{ item.label }}</a
                  >
                }
              </div>
            </div>
          </div>
        </div>

        <a
          routerLink="/latest-event"
          (click)="closeMobileMenu()"
          routerLinkActive
          #mEventsActive="routerLinkActive"
          [class]="mEventsActive.isActive ? 'text-[#B00000] font-bold' : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'"
          >Latest Events</a
        >
        <a
          routerLink="/career"
          (click)="closeMobileMenu()"
          routerLinkActive
          #mCareerActive="routerLinkActive"
          [class]="mCareerActive.isActive ? 'text-[#B00000] font-bold' : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'"
          >Career</a
        >
        <a
          routerLink="/contact"
          (click)="closeMobileMenu()"
          routerLinkActive
          #mContactActive="routerLinkActive"
          [class]="mContactActive.isActive ? 'text-[#B00000] font-bold' : 'text-gray-700 hover:text-[#B00000] transition duration-300 ease-in-out'"
          >Contact Us</a
        >
      </div>
    </div>
  </section>
</div>
